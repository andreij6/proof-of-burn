canisters:
  - name: backend
    recipe:
      type: "@dfinity/rust@v3.2.0"
      configuration:
        package: backend
        candid: src/backend/backend.did
    settings:
      # 30 days (owner, 2026-07-06 cycles review — was 90) — canister freezes if
      # the cycle balance can't sustain 30 days of idle burn. On-chain auto
      # top-up (cycle_topup_check timer) refills from the treasury before this
      # threshold is hit. Never set below 30 days for a value-holding canister.
      freezing_threshold: 2592000
    init_args: '(record { owner = principal "gwrne-un4am-3lsx4-7dmak-pnj5y-zxsk2-aalax-2rzyk-k4e23-jgmqy-3qe"; primary_neuron_id = (4821667 : nat64); default_threshold_e8s = (200000000 : nat64); ai_price_e8s = (5000000 : nat64); ledger_canister_id = opt principal "a2cb4-hh777-77775-aaaba-cai" })'
  # CourseNFT (ICRC-7) ledger for the Course NFT marketplace (PB-300/301). The
  # backend is the allowlisted minter/custodian — its local canister id is the
  # init `minter`. After deploy, wire the backend at this canister via
  # admin_set_course_nft_canister (see scripts/deploy-local.sh).
  - name: course_nft
    recipe:
      type: "@dfinity/rust@v3.2.0"
      configuration:
        package: course_nft
        candid: src/course_nft/course_nft.did
    init_args: '(record { minter = principal "a2cb4-hh777-77775-aaaba-cai"; admin = principal "gwrne-un4am-3lsx4-7dmak-pnj5y-zxsk2-aalax-2rzyk-k4e23-jgmqy-3qe"; symbol = null; name = null; supply_cap = null })'
  # Stake Voucher NFT (ICRC-7) — okf/ideas/stake-vouchers. The backend is the
  # sole minter/burner/transfer authority; wired after deploy via
  # admin_set_voucher_nft_canister (see scripts/deploy-local.sh).
  - name: voucher_nft
    recipe:
      type: "@dfinity/rust@v3.2.0"
      configuration:
        package: voucher_nft
        candid: src/voucher_nft/voucher_nft.did
    init_args: '(record { minter = principal "a2cb4-hh777-77775-aaaba-cai"; admin = principal "gwrne-un4am-3lsx4-7dmak-pnj5y-zxsk2-aalax-2rzyk-k4e23-jgmqy-3qe"; symbol = null; name = null })'
  - name: frontend
    recipe:
      type: "@dfinity/asset-canister@v2.1.0"
      configuration:
        dir: src/frontend/dist
        build:
          - npm --prefix src/frontend install --cache=./.npm-cache
          - npm --prefix src/frontend run build
  - name: ledger
    recipe:
      type: "@dfinity/prebuilt@v2.0.0"
      configuration:
        candid: src/backend/ledger.did
        path: src/backend/ledger.wasm.gz
    init_args: '(variant { Init = record { token_symbol = "ICP"; token_name = "Internet Computer Protocol"; decimals = opt (8 : nat8); transfer_fee = (10_000 : nat); metadata = vec {}; minting_account = record { owner = principal "m4zh5-ybqlr-txnmf-v26f2-2h77i-rlufn-z33hj-wrt5i-yzav5-iab77-wae" }; initial_balances = vec { record { record { owner = principal "gwrne-un4am-3lsx4-7dmak-pnj5y-zxsk2-aalax-2rzyk-k4e23-jgmqy-3qe" }; (100_000_000_000 : nat) }; record { record { owner = principal "p2brp-aweqp-cxzia-sgqhq-poq4q-bxk6a-pyqz7-djize-23g7c-ejuz3-nqe" }; (100_000_000_000 : nat) }; record { record { owner = principal "a2cb4-hh777-77775-aaaba-cai" }; (100_000_000_000 : nat) } }; archive_options = record { num_blocks_to_archive = (1000 : nat64); trigger_threshold = (2000 : nat64); controller_id = principal "gwrne-un4am-3lsx4-7dmak-pnj5y-zxsk2-aalax-2rzyk-k4e23-jgmqy-3qe" }; feature_flags = opt record { icrc2 = true } } })'

  # Local-only ckBTC test ledger (real symbol/decimals/fee) so the Idea Board
  # multi-token flow is exercisable end-to-end. After (re)deploy, point the
  # backend at it: icp canister call backend admin_set_token_ledger
  # '(variant { CkBTC }, principal "<id>")' -e local --identity dev1
  - name: ckbtc-ledger
    recipe:
      type: "@dfinity/prebuilt@v2.0.0"
      configuration:
        candid: src/backend/ledger.did
        path: src/backend/ledger.wasm.gz
    init_args: '(variant { Init = record { token_symbol = "ckBTC"; token_name = "Chain-key Bitcoin (local test)"; decimals = opt (8 : nat8); transfer_fee = (10 : nat); metadata = vec {}; minting_account = record { owner = principal "m4zh5-ybqlr-txnmf-v26f2-2h77i-rlufn-z33hj-wrt5i-yzav5-iab77-wae" }; initial_balances = vec { record { record { owner = principal "gwrne-un4am-3lsx4-7dmak-pnj5y-zxsk2-aalax-2rzyk-k4e23-jgmqy-3qe" }; (10_000_000_000 : nat) }; record { record { owner = principal "p2brp-aweqp-cxzia-sgqhq-poq4q-bxk6a-pyqz7-djize-23g7c-ejuz3-nqe" }; (10_000_000_000 : nat) }; record { record { owner = principal "a2cb4-hh777-77775-aaaba-cai" }; (100_000_000_000 : nat) } }; archive_options = record { num_blocks_to_archive = (1000 : nat64); trigger_threshold = (2000 : nat64); controller_id = principal "gwrne-un4am-3lsx4-7dmak-pnj5y-zxsk2-aalax-2rzyk-k4e23-jgmqy-3qe" }; feature_flags = opt record { icrc2 = true } } })'
  # Local-only ckETH test ledger (18 decimals, canonical 0.000002 fee).
  - name: cketh-ledger
    recipe:
      type: "@dfinity/prebuilt@v2.0.0"
      configuration:
        candid: src/backend/ledger.did
        path: src/backend/ledger.wasm.gz
    init_args: '(variant { Init = record { token_symbol = "ckETH"; token_name = "Chain-key Ethereum (local test)"; decimals = opt (18 : nat8); transfer_fee = (2_000_000_000_000 : nat); metadata = vec {}; minting_account = record { owner = principal "m4zh5-ybqlr-txnmf-v26f2-2h77i-rlufn-z33hj-wrt5i-yzav5-iab77-wae" }; initial_balances = vec { record { record { owner = principal "gwrne-un4am-3lsx4-7dmak-pnj5y-zxsk2-aalax-2rzyk-k4e23-jgmqy-3qe" }; (2_000_000_000_000_000_000 : nat) }; record { record { owner = principal "p2brp-aweqp-cxzia-sgqhq-poq4q-bxk6a-pyqz7-djize-23g7c-ejuz3-nqe" }; (2_000_000_000_000_000_000 : nat) }; record { record { owner = principal "a2cb4-hh777-77775-aaaba-cai" }; (10_000_000_000_000_000_000 : nat) } }; archive_options = record { num_blocks_to_archive = (1000 : nat64); trigger_threshold = (2000 : nat64); controller_id = principal "gwrne-un4am-3lsx4-7dmak-pnj5y-zxsk2-aalax-2rzyk-k4e23-jgmqy-3qe" }; feature_flags = opt record { icrc2 = true } } })'

  # Local-only ckUSDC test ledger (6 decimals, canonical 0.01 fee) for the
  # Dapp Explorer's paid listings.
  - name: ckusdc-ledger
    recipe:
      type: "@dfinity/prebuilt@v2.0.0"
      configuration:
        candid: src/backend/ledger.did
        path: src/backend/ledger.wasm.gz
    init_args: '(variant { Init = record { token_symbol = "ckUSDC"; token_name = "Chain-key USDC (local test)"; decimals = opt (6 : nat8); transfer_fee = (10_000 : nat); metadata = vec {}; minting_account = record { owner = principal "m4zh5-ybqlr-txnmf-v26f2-2h77i-rlufn-z33hj-wrt5i-yzav5-iab77-wae" }; initial_balances = vec { record { record { owner = principal "gwrne-un4am-3lsx4-7dmak-pnj5y-zxsk2-aalax-2rzyk-k4e23-jgmqy-3qe" }; (100_000_000_000 : nat) }; record { record { owner = principal "p2brp-aweqp-cxzia-sgqhq-poq4q-bxk6a-pyqz7-djize-23g7c-ejuz3-nqe" }; (100_000_000_000 : nat) }; record { record { owner = principal "a2cb4-hh777-77775-aaaba-cai" }; (100_000_000_000 : nat) } }; archive_options = record { num_blocks_to_archive = (1000 : nat64); trigger_threshold = (2000 : nat64); controller_id = principal "gwrne-un4am-3lsx4-7dmak-pnj5y-zxsk2-aalax-2rzyk-k4e23-jgmqy-3qe" }; feature_flags = opt record { icrc2 = true } } })'

  # Local-only ckUSDT test ledger (6 decimals, canonical 0.01 fee).
  - name: ckusdt-ledger
    recipe:
      type: "@dfinity/prebuilt@v2.0.0"
      configuration:
        candid: src/backend/ledger.did
        path: src/backend/ledger.wasm.gz
    init_args: '(variant { Init = record { token_symbol = "ckUSDT"; token_name = "Chain-key Tether (local test)"; decimals = opt (6 : nat8); transfer_fee = (10_000 : nat); metadata = vec {}; minting_account = record { owner = principal "m4zh5-ybqlr-txnmf-v26f2-2h77i-rlufn-z33hj-wrt5i-yzav5-iab77-wae" }; initial_balances = vec { record { record { owner = principal "gwrne-un4am-3lsx4-7dmak-pnj5y-zxsk2-aalax-2rzyk-k4e23-jgmqy-3qe" }; (100_000_000_000 : nat) }; record { record { owner = principal "p2brp-aweqp-cxzia-sgqhq-poq4q-bxk6a-pyqz7-djize-23g7c-ejuz3-nqe" }; (100_000_000_000 : nat) }; record { record { owner = principal "a2cb4-hh777-77775-aaaba-cai" }; (100_000_000_000 : nat) } }; archive_options = record { num_blocks_to_archive = (1000 : nat64); trigger_threshold = (2000 : nat64); controller_id = principal "gwrne-un4am-3lsx4-7dmak-pnj5y-zxsk2-aalax-2rzyk-k4e23-jgmqy-3qe" }; feature_flags = opt record { icrc2 = true } } })'

networks:
  - name: local
    mode: managed
    ii: true

environments:
  - name: local
    network: local
    canisters:
      - backend
      - course_nft
      - voucher_nft
      - frontend
      - ledger
      - ckbtc-ledger
      - cketh-ledger
      - ckusdc-ledger
      - ckusdt-ledger
  - name: staging
    network: ic
    canisters:
      - backend
      - frontend
  - name: production
    network: ic
    canisters:
      - backend
      - frontend
      # course_nft added 2026-07-04 (first mainnet deploy of the course
      # marketplace — the canister is created by `icp deploy -e production`).
      - course_nft
