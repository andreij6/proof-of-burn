[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
candid = "0.10"
ic-cdk = "0.19"
ic-cdk-timers = "1.0.0"
ic-stable-structures = "0.7"
icrc-ledger-types = "0.1"
serde = { version = "1", features = ["derive"] }
ciborium = "0.2"
serde_json = "1"
sha2 = "0.10"
# ANSEM LP rewards: Ed25519 wallet-signature verification + Solana
# base58 addresses + PDA on-curve checks (all wasm-safe, no rand).
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"] }
# ICPSwap LP valuation: Uniswap-v3 tick math needs 256-bit arithmetic
# (sqrtPriceX96 products). Pure Rust, wasm-safe.
primitive-types = { version = "0.13", default-features = false }
curve25519-dalek = { version = "4", default-features = false, features = ["alloc"] }
bs58 = "0.5"

[dev-dependencies]
pocket-ic = "9"
candid = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }


