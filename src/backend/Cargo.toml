[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
candid = "0.10"
ic-cdk = "0.19"
ic-cdk-timers = "1.0.0"
ic-stable-structures = "0.7"
icrc-ledger-types = "0.1"
serde = { version = "1", features = ["derive"] }
ciborium = "0.2"
serde_json = "1"
sha2 = "0.10"

